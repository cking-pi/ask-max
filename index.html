<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Ask Max Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    .chat-box {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      min-height: 300px;
      background: #f7f7f7;
      white-space: pre-wrap;
    }

    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      font-size: 16px;
      box-sizing: border-box;
      min-height: 90px;
    }

    button {
      margin-top: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 16px;
    }

    .status {
      margin-top: 12px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Ask Max Test</h1>

  <div class="chat-box" id="chatBox">
Ask Max: Hi there! Can I get your name, your company name, and the machine you're working with?
  </div>

  <textarea id="message" placeholder="Type your message here..."></textarea>

  <button onclick="sendMessage()">Send</button>
  <button onclick="resetSession()">Reset Session</button>

  <div class="status" id="status"></div>

  <script>
    async function sendMessage() {
      const messageInput = document.getElementById("message");
      const chatBox = document.getElementById("chatBox");
      const status = document.getElementById("status");

      const message = messageInput.value.trim();

      if (!message) {
        status.textContent = "Type a message first.";
        return;
      }

      const sessionId = sessionStorage.getItem("askMaxSessionId");
      const threadId = sessionStorage.getItem("askMaxThreadId");
      const startedAt = sessionStorage.getItem("askMaxStartedAt");

      chatBox.textContent += "\n\nYou: " + message;
      messageInput.value = "";
      status.textContent = "Max is thinking...";

      try {
        const response = await fetch("/.netlify/functions/ask-max-chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sessionId,
            threadId,
            startedAt,
            message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error || "Request failed");
        }

        if (data.sessionId) {
          sessionStorage.setItem("askMaxSessionId", data.sessionId);
        }

        if (data.threadId) {
          sessionStorage.setItem("askMaxThreadId", data.threadId);
        }

        if (data.startedAt) {
          sessionStorage.setItem("askMaxStartedAt", data.startedAt);
        }

        chatBox.textContent += "\n\nAsk Max: " + data.reply;

        status.textContent =
          "Logged. Name: " +
          (data.name || "not captured") +
          " | Company: " +
          (data.company || "not captured") +
          " | Machine: " +
          (data.machine || "not captured");

      } catch (error) {
        chatBox.textContent += "\n\nError: " + error.message;
        status.textContent = "Something went wrong.";
      }
    }

    function resetSession() {
      sessionStorage.removeItem("askMaxSessionId");
      sessionStorage.removeItem("askMaxThreadId");
      sessionStorage.removeItem("askMaxStartedAt");

      document.getElementById("chatBox").textContent =
        "Ask Max: Hi there! Can I get your name, your company name, and the machine you're working with?";

      document.getElementById("status").textContent = "Session reset.";
    }
  </script>
</body>
</html>
