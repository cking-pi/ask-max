<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ask Max Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
      color: #111;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subhead {
      margin-top: 0;
      color: #555;
      font-size: 15px;
    }

    .chat-wrapper {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 24px;
    }

    .chat-header {
      background: #04173f;
      color: #ffffff;
      padding: 16px 18px;
      font-weight: bold;
    }

    .chat-box {
      min-height: 360px;
      max-height: 520px;
      overflow-y: auto;
      padding: 18px;
      background: #ebe7db;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      max-width: 82%;
      word-wrap: break-word;
    }

    .bot {
      background: #ffffff;
      color: #111;
      margin-right: auto;
    }

    .user {
      background: #321061;
      color: #ffffff;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 14px;
      background: #ffffff;
      border-top: 1px solid #ddd;
    }

    textarea {
      flex: 1;
      min-height: 54px;
      max-height: 140px;
      padding: 12px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      background: #321061;
      color: #ffffff;
    }

    button.secondary {
      background: #666;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #444;
      font-size: 14px;
      line-height: 1.45;
    }

    .debug {
      margin-top: 14px;
      padding: 12px;
      background: #111;
      color: #f5f5f5;
      border-radius: 8px;
      font-size: 13px;
      white-space: pre-wrap;
      display: none;
      overflow-x: auto;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }

    .actions button {
      padding: 10px 14px;
    }

    @media (max-width: 700px) {
      body {
        margin: 20px auto;
        padding: 12px;
      }

      .input-area {
        flex-direction: column;
      }

      button {
        padding: 12px 16px;
      }

      .message {
        max-width: 94%;
      }
    }
  </style>
</head>

<body>
  <h1>Ask Max Test</h1>
  <p class="subhead">
    Temporary test page for the Netlify backend before connecting the HubSpot module.
  </p>

  <div class="chat-wrapper">
    <div class="chat-header">
      Ask Max
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
Ask Max: Hi there! Can I get your name, company name, and the machine you're working with?
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="messageInput"
        placeholder="Example: My name is Jon from ABC Com. I have a question about our Voyager."
      ></textarea>

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>
    </div>
  </div>

  <div class="actions">
    <button class="secondary" onclick="resetSession()">Reset Session</button>
    <button class="secondary" onclick="toggleDebug()">Show/Hide Debug</button>
  </div>

  <div class="status" id="status">
    Status: Waiting for message.
  </div>

  <div class="debug" id="debugBox">
    Debug details will show here.
  </div>

  <script>
    const FUNCTION_URL = "/.netlify/functions/ask-max-chat";

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusBox = document.getElementById("status");
    const debugBox = document.getElementById("debugBox");

    messageInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chatBox.appendChild(message);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const message = messageInput.value.trim();

      if (!message) {
        statusBox.textContent = "Status: Type a message first.";
        return;
      }

      const sessionId = sessionStorage.getItem("askMaxSessionId");
      const threadId = sessionStorage.getItem("askMaxThreadId");
      const startedAt = sessionStorage.getItem("askMaxStartedAt");

      addMessage("You: " + message, "user");

      messageInput.value = "";
      sendButton.disabled = true;
      statusBox.textContent = "Status: Max is thinking...";

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sessionId: sessionId,
            threadId: threadId,
            startedAt: startedAt,
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error || "Request failed.");
        }

        if (data.sessionId) {
          sessionStorage.setItem("askMaxSessionId", data.sessionId);
        }

        if (data.threadId) {
          sessionStorage.setItem("askMaxThreadId", data.threadId);
        }

        if (data.startedAt) {
          sessionStorage.setItem("askMaxStartedAt", data.startedAt);
        }

        addMessage("Ask Max: " + (data.reply || "No reply returned."), "bot");

        const googleLogText = data.googleLog
          ? data.googleLog.action + " | " + data.googleLog.inputHeader + " / " + data.googleLog.outputHeader
          : "not returned";

        statusBox.innerHTML =
          "<strong>Status:</strong> Logged to backend.<br>" +
          "<strong>Name:</strong> " + escapeHtml(data.name || "not captured") + "<br>" +
          "<strong>Company:</strong> " + escapeHtml(data.company || "not captured") + "<br>" +
          "<strong>Machine:</strong> " + escapeHtml(data.machine || "not captured") + "<br>" +
          "<strong>Google Log:</strong> " + escapeHtml(googleLogText) + "<br>" +
          "<strong>Session ID:</strong> " + escapeHtml(data.sessionId || "missing") + "<br>" +
          "<strong>Thread ID:</strong> " + escapeHtml(data.threadId || "missing");

        debugBox.textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        addMessage("Error: " + error.message, "bot");

        statusBox.innerHTML =
          "<strong>Status:</strong> Something went wrong.<br>" +
          "<strong>Error:</strong> " + escapeHtml(error.message);

        debugBox.textContent = error.stack || error.message;
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    function resetSession() {
      sessionStorage.removeItem("askMaxSessionId");
      sessionStorage.removeItem("askMaxThreadId");
      sessionStorage.removeItem("askMaxStartedAt");

      chatBox.innerHTML = "";

      addMessage(
        "Ask Max: Hi there! Can I get your name, company name, and the machine you're working with?",
        "bot"
      );

      statusBox.textContent = "Status: Session reset.";
      debugBox.textContent = "Session reset.";
      messageInput.value = "";
      messageInput.focus();
    }

    function toggleDebug() {
      debugBox.style.display = debugBox.style.display === "none" || !debugBox.style.display
        ? "block"
        : "none";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
